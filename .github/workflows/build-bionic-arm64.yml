# Build this tree for Ubuntu 18.04 arm64 (nvnano: Jetson Nano). See
# ci/README.md. Replaces upstream's CI on this branch: those workflows target
# upstream's own matrix and self-hosted runners.
#
# push to bionic-arm64: build + regress suite, tarball as a run artifact.
# tag v<ver>-<n> (e.g. v10.5p1-1): the same, then a GitHub Release carrying
# the tarball, its .sha256 and build-info.txt. roles/infra/openssh_upstream
# downloads the release asset and pins its sha256.
name: build-bionic-arm64

on:
  push:
    branches: [bionic-arm64]
    tags: ['v*p*-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Native arm64: no qemu, so the regress suite runs in reasonable time.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # docker run rather than a `container:` job: actions' own node runtime
      # does not start on bionic's glibc 2.27.
      - name: Build inside ubuntu:18.04
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e GITHUB_SHA \
            -e RELEASE_TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}" \
            arm64v8/ubuntu:18.04 ci/build-bionic-arm64.sh

      - uses: actions/upload-artifact@v4
        with:
          name: openssh-bionic-arm64
          path: out/
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(cut -d' ' -f1 out/*.tar.gz.sha256)"
          {
            echo "OpenSSH built for Ubuntu 18.04 arm64 (Jetson Nano), from commit ${GITHUB_SHA}."
            echo
            echo "sha256: \`${sha}\`"
            echo
            echo '```'
            cat out/build-info.txt
            echo '```'
          } > "${RUNNER_TEMP}/notes.md"
          gh release create "${GITHUB_REF_NAME}" \
            out/*.tar.gz out/*.tar.gz.sha256 out/build-info.txt \
            --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
